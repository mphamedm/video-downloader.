name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git ccache libffi-dev libssl-dev \
          openjdk-17-jdk zip unzip autoconf libtool cmake pkg-config \
          python3-dev python3-setuptools lld clang
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer python-for-android

    - name: Build APK
      run: |
        export APP_ACCEPT_SDK_LICENSE=1
        buildozer -s android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
